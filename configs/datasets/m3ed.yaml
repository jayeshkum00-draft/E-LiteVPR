# M3ED (Prophesee EVK4 HD + OVC global-shutter RGB) preprocessing config.
# Unlike DSEC, M3ED ships BOTH streams raw: radtan-distorted, unrectified,
# two physically separate cameras. preprocess_m3ed.py therefore builds its own
# event undistortion map and warps the RGB into the event frame via the
# infinite homography (see that file's docstring).
SENSOR_HW: [720, 1280]             # prophesee/left resolution (H, W)
event_voxel_bins: 3
event_hot_pixels_threshold: 99.5
event_timesurface_decay_frac: 1.0  # tau = this * window span

target_hz: 2.0                     # OVC runs at 25 Hz; subsample by TIMESTAMP
event_window_ms: 50                # events in [t_frame - window, t_frame]

# Stationary-vehicle gate: drop pairs whose event window is near-empty (the
# car stopped at a light), as events per sensor pixel so the number does not
# depend on this sensor's resolution. Measured on car_urban_day_horse at
# 50 ms: driving windows hold 6.7e5-9.4e5 events (0.73-1.02 ev/px) and fill
# 22-27% of the output frame above 0.05; stopped windows hold 7.9e4
# (0.086 ev/px) and fill 0.2%. 0.25 sits in the empty gap between the two
# regimes -- see preprocess_m3ed.py for why unit-max normalisation makes
# this undetectable if it is not filtered here.
min_events_per_px: 0.25

# Exposure filter, identical semantics/keys to ddd20.yaml but applied to the
# grayscale of the OVC colour frame. M3ED's OVC is auto-exposed and much
# better behaved than a DAVIS APS, so this is a safety net for tunnel /
# headlight-glare frames rather than a primary filter.
exposure_min_mean: 10
exposure_max_mean: 245
exposure_max_dark_frac: 0.60      # fraction of pixels <= 1
exposure_max_bright_frac: 0.75    # fraction of pixels >= 254

# Aspect ratio the common-FOV crop is trimmed to before the square 384x384
# resize. EVERY other source in the corpus is 4:3 -- DSEC 640x480, DDD20
# 346x260, and both evaluation sets (Brisbane DAVIS346 346x260, NSAVP
# DVXplorer 640x480) -- so all of them stretch into the square by 1.333.
# M3ED's raw common FOV is 1176x665 (1.769), which would make it the only
# source whose geometry disagrees with the frames the student is scored on;
# measured with a synthetic circle, a 1.769 crop turns it into an ellipse of
# h/w 1.769 vs DSEC's 1.333 (the INTER_AREA flag does not affect this -- it
# controls aliasing, not the per-axis scale factors).
# Costs 25% of horizontal FOV (1176 -> 886 px). Set to null to keep the full
# FOV and ablate the choice. The evaluation sets are NOT modified by this --
# only this training source is brought into line with them.
match_aspect: 1.3333333

m3ed_path: '/placeholder/for/m3ed_path'   # dir of <seq>_data.h5 files (or one file)

# Visual-check mode: when set, preprocess_m3ed.py writes
# [RGB | events | overlay] PNGs here and writes NO .npy / pairs.txt.
debug_overlay_dir: null
debug_max_frames: 24              # frames sampled across the sequence in that mode

# --- training-side keys -----------------------------------------------------
# Same key names as dsec.yaml/ddd20.yaml so train.py treats every source
# uniformly:
#   1. teacher caching -- `feature_extractor.py datasets=m3ed`
#   2. joint phase 1  -- `train.py datasets=dsec datasets@datasets_extra=m3ed`
root_dir: '/placeholder/for/preprocessed_m3ed'   # preprocess_m3ed.py output root
output_dir: '/placeholder/for/m3ed_features'     # teacher feature cache
pairs_name: 'pairs.txt'

# null -> every sequence in pairs.txt; [] -> source sits the split out.
# M3ED sequence names are the h5 stems without the _data suffix,
# e.g. 'car_urban_day_horse'. Left null so new sequences are picked up.
train_seq_list: null
val_seq_list: []          # train-only: val stays pure DSEC so val_loss and
                          # early stopping stay comparable to earlier runs

# Fed to the SAME day/night WeightedRandomSampler as dsec/ddd20. M3ED names
# encode the condition, so list the *_night_* sequences you preprocess here.
night_sequences: []

pair_stride: 1            # train-split subsampling / volume knob
