# DDD20 (DAVIS346, ddd20-utils raw hdf5 recordings) preprocessing config.
# Single DAVIS chip -- APS and DVS share one pixel array, so (unlike DSEC)
# there is no separate RGB camera, no calibration, and no rectification step.
SENSOR_HW: [260, 346]              # DAVIS346 (H, W)
event_voxel_bins: 3
event_hot_pixels_threshold: 99.5
event_timesurface_decay_frac: 1.0  # tau = this * window span (t_end_us - t_start_us)

target_hz: 1.0                     # APS subsampling rate (time-based, not index-based)
event_window_ms: 50                # per kept frame, events in [t_frame - window, t_frame]

# APS exposure filter (0-255 domain, after the 16-bit -> 8-bit >>8 conversion
# ddd20-utils' own export.py uses). Frames outside this band, or with too many
# clipped pixels, are skipped -- the next candidate frame is tried instead
# (does not reset the 1 Hz clock).
# Dark/bright clipping have SEPARATE budgets (tuned on real DDD20 diagnostics,
# 2026-07-27): a fully clipped-white sky is normal for a DAVIS aimed at a
# bright horizon and the road scene below is still teacher-visible (hi-clip
# medians 0.39-0.58 on good highway recordings), so the bright budget is
# loose. A mostly clipped-black frame (rural night, lo-clip ~0.8) carries no
# teacher-visible content -- distilling against it teaches the student the
# wrong target -- so the dark budget is tight.
exposure_min_mean: 10
exposure_max_mean: 245
exposure_max_dark_frac: 0.60      # fraction of pixels <= 1
exposure_max_bright_frac: 0.75    # fraction of pixels >= 254

ddd20_path: '/placeholder/for/ddd20_path'   # dir of recXXXXXXXXXX.hdf5 files

# --- training-side keys -----------------------------------------------------
# Same key names as dsec.yaml, so train.py treats both datasets uniformly.
# Used two ways:
#   1. teacher caching -- `feature_extractor.py datasets=ddd20`
#      (reads root_dir/pairs_name, writes the feature cache to output_dir)
#   2. joint DSEC+DDD20 phase 1 --
#      `train.py datasets=dsec datasets@datasets_extra=ddd20`
#      which keeps DSEC primary and appends DDD20 to the TRAIN split only.
root_dir: '/placeholder/for/preprocessed_ddd20'   # preprocess_ddd20.py output root
output_dir: '/placeholder/for/ddd20_features'     # teacher feature cache for DDD20
pairs_name: 'pairs.txt'

# Sequence-list semantics in train.py (identical for every dataset config):
#   null          -> every sequence found in this source's pairs.txt
#   [] or missing -> this source sits the split out
#   list of names -> exactly those sequences
# DDD20 sequence names are the h5 stems, e.g. 'rec1500329649'. Left null so
# newly preprocessed recordings are picked up without editing this list.
train_seq_list: null
val_seq_list: []          # train-only: val stays pure DSEC so val_loss and
                          # early stopping remain comparable to the DSEC-only
                          # phase-1 runs

# Recordings whose kept frames are lit-night / dusk. Unioned with dsec.yaml's
# night_sequences and fed to the SAME day/night WeightedRandomSampler -- no
# extra source-mixing weight. Pitch-black rural-night frames are already
# dropped by the exposure filter above, so only street-lit recordings belong
# here.
night_sequences: []

pair_stride: 1            # train-split subsampling; the volume knob if you
                          # ever need to rebalance DSEC vs DDD20 sample counts
