# SALAD-aggregated student (Phase 1). Same backbone/projection as
# student_model.yaml; GeM is replaced by optimal-transport aggregation.
# num_patches / img_hw MUST still match the teacher cache (384x384, 576 patches).

backbone_name: 'vit_small_patch16_dinov3.lvd1689m'
img_hw: [384, 384]          # must equal teacher_model.yaml img_hw
patch_size: 16
num_patches: 576            # must equal teacher_model.yaml expected_patches
teacher_dim: 1024           # must equal teacher_model.yaml teacher_model_output_dim

# --- SALAD head ------------------------------------------------------------
# Descriptor dim = num_clusters * cluster_dim + token_dim.
# Defaults below give 64*128 + 256 = 8448, matching MegaLoc so the comparison
# in Table 1 is at equal descriptor width. Shrink cluster_dim (or clusters)
# for a more compact descriptor; report whichever you use.
num_clusters: 64
cluster_dim: 128            # tokens are projected 1024 -> 128 BEFORE clustering
token_dim: 256              # CLS-token global branch
sinkhorn_iters: 3
