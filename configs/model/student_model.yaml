# Student model (Phase 1 distillation target of the cached DINOv3 teacher).
# num_patches / img_hw MUST match the teacher cache (384x384, ViT-L/16 -> 576 patches).
# If these drift from model/teacher_model.yaml's expected_patches, AGFD spatial
# correspondence silently breaks -- see session notes.

backbone_name: 'vit_small_patch16_dinov3.lvd1689m'
img_hw: [384, 384]          # must equal teacher_model.yaml img_hw
patch_size: 16
num_patches: 576            # must equal teacher_model.yaml expected_patches
teacher_dim: 1024           # must equal teacher_model.yaml teacher_model_output_dim

# Patch aggregation. Override at runtime: `model.pooling=signed`.
#   clamp   stock GeM, state-dict key `gem.p`. Every checkpoint predating this
#           flag was trained with it, so it stays the default and the control.
#   signed  sign-preserving GeM: the pooling input is a signed nn.Linear output,
#           and the stock clamp deletes 62-70% of it (with zero gradient) and
#           forces the descriptor into the positive orthant.
#   mean    plain mean, the p=1 control.
# signed/mean register as `pool.p`, NOT `gem.p` -- a strict load_state_dict then
# refuses a checkpoint from the other family instead of pooling it the wrong way.
# Score those with scripts/evaluate_brisbane_gem.py (evaluate_brisbane.py builds
# the student without this kwarg).
pooling: clamp

# Same three values, applied to the frozen GeM that train.py runs over the
# CACHED TEACHER PATCHES to build the structural target. Those tokens are
# signed as well, so 'clamp' truncates the target, not just the student.
# Separate key so the two sides stay one-flag-at-a-time ablatable.
# Affects the target only -- it changes no state-dict key and no checkpoint.
teacher_pooling: clamp
